name: App de macOS

on:
  push:
    paths: ["LostAndPrompt/**", "project.yml", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["LostAndPrompt/**", "project.yml", ".github/workflows/macos.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: xcodebuild -project LostAndPrompt.xcodeproj -scheme LostAndPrompt -configuration Release -derivedDataPath build ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGN_IDENTITY=- build
