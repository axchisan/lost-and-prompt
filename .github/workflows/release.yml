name: Publicar versión

# Se dispara al subir una etiqueta vX.Y.Z (scripts/bump-version.sh + git tag + git push --tags).
# Compila macOS, Windows y Linux, crea la release con las notas del CHANGELOG y actualiza Homebrew.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta ya existente a publicar (vX.Y.Z)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - id: version
        name: La etiqueta coincide con VERSION y hay notas en el CHANGELOG
        run: |
          version=$(cat VERSION)
          [ "v$version" = "$TAG" ] || { echo "::error::La etiqueta $TAG no coincide con VERSION ($version)"; exit 1; }
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::Falta la sección ## [$version] en CHANGELOG.md"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  macos:
    needs: verify
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: brew install xcodegen
      - run: scripts/release.sh
      - run: |
          mv "build/LostAndPrompt-${{ needs.verify.outputs.version }}.dmg" "LostAndPrompt-${{ needs.verify.outputs.version }}-macos-universal.dmg"
          mv "build/LostAndPrompt-${{ needs.verify.outputs.version }}.zip" "LostAndPrompt-${{ needs.verify.outputs.version }}-macos-universal.zip"
      - uses: actions/download-artifact@v4
        with:
          name: notes
      - name: Firmar para Sparkle y generar appcast.xml
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::Sin SPARKLE_PRIVATE_KEY: la versión de Mac no tendrá actualizaciones automáticas."
            exit 0
          fi
          v=${{ needs.verify.outputs.version }}
          archive="LostAndPrompt-$v-macos-universal.zip"
          build=$(sed -n 's/.*CURRENT_PROJECT_VERSION: "\([0-9]*\)"/\1/p' project.yml | head -1)
          curl -sL -o sparkle.tar.xz https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz
          mkdir sparkle && tar xf sparkle.tar.xz -C sparkle
          sig=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | sparkle/bin/sign_update --ed-key-file - "$archive")
          notes=$(python3 .github/scripts/notes_to_html.py notes.md)
          cat > appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>Lost &amp; Prompt</title>
              <item>
                <title>Lost &amp; Prompt $v</title>
                <pubDate>$(LC_ALL=C date -u "+%a, %d %b %Y %H:%M:%S +0000")</pubDate>
                <sparkle:version>$build</sparkle:version>
                <sparkle:shortVersionString>$v</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>
                <description><![CDATA[$notes]]></description>
                <enclosure url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$archive" $sig type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          XML
          sed -i '' 's/^          //' appcast.xml
          cat appcast.xml
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            LostAndPrompt-*.dmg
            LostAndPrompt-*.zip
            appcast.xml
          if-no-files-found: error

  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Dependencias de sistema (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: desktop
      - name: Compilar (firmando las actualizaciones si hay clave)
        working-directory: desktop
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::Sin TAURI_SIGNING_PRIVATE_KEY: la versión no tendrá actualizaciones automáticas."
            pnpm tauri build
          fi
      - name: Nombres sin espacios ni &
        shell: bash
        run: |
          v=${{ needs.verify.outputs.version }}
          mkdir -p out
          b=target/release/bundle
          if [ "${{ matrix.name }}" = windows ]; then
            cp "$b"/nsis/*.exe "out/LostAndPrompt-$v-windows-x64-setup.exe"
            if ls "$b"/nsis/*.exe.sig >/dev/null 2>&1; then cp "$b"/nsis/*.exe.sig "out/LostAndPrompt-$v-windows-x64-setup.exe.sig"; fi
          else
            cp "$b"/deb/*.deb "out/LostAndPrompt-$v-linux-amd64.deb"
            cp "$b"/rpm/*.rpm "out/LostAndPrompt-$v-linux-x86_64.rpm"
            cp "$b"/appimage/*.AppImage "out/LostAndPrompt-$v-linux-x86_64.AppImage"
            if ls "$b"/appimage/*.AppImage.sig >/dev/null 2>&1; then cp "$b"/appimage/*.AppImage.sig "out/LostAndPrompt-$v-linux-x86_64.AppImage.sig"; fi
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [verify, macos, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Manifiesto de actualizaciones (latest.json)
        working-directory: dist
        run: |
          v=${{ needs.verify.outputs.version }}
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          win="LostAndPrompt-$v-windows-x64-setup.exe"
          linux="LostAndPrompt-$v-linux-x86_64.AppImage"
          if [ -f "$win.sig" ] && [ -f "$linux.sig" ]; then
            jq -n --arg v "$v" --arg notes "$(cat notes.md)" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --arg wsig "$(cat "$win.sig")" --arg wurl "$base/$win" \
              --arg lsig "$(cat "$linux.sig")" --arg lurl "$base/$linux" \
              '{version: $v, notes: $notes, pub_date: $date, platforms: {
                 "windows-x86_64": {signature: $wsig, url: $wurl},
                 "linux-x86_64": {signature: $lsig, url: $lurl}}}' > latest.json
            cat latest.json
          else
            echo "::warning::Sin firmas: no se publica latest.json."
          fi
      - name: Sumas de verificación
        working-directory: dist
        run: |
          ls LostAndPrompt-* | grep -v '\.sig$' | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ needs.verify.outputs.version }}
          extra=""
          [ -f dist/latest.json ] && extra="$extra dist/latest.json"
          [ -f dist/appcast.xml ] && extra="$extra dist/appcast.xml"
          gh release create "$TAG" dist/LostAndPrompt-* dist/SHA256SUMS.txt $extra \
            --repo "$GITHUB_REPOSITORY" --title "Lost & Prompt $v" --notes-file dist/notes.md
      - name: Actualizar el cask de Homebrew
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$TAP_KEY" ]; then
            echo "::warning::Falta el secreto HOMEBREW_TAP_DEPLOY_KEY (scripts/setup-tap-key.sh): actualiza el cask a mano."
            exit 0
          fi
          v=${{ needs.verify.outputs.version }}
          sha=$(sha256sum "dist/LostAndPrompt-$v-macos-universal.dmg" | cut -d' ' -f1)
          install -m 600 /dev/null ~/tap_key
          printf '%s\n' "$TAP_KEY" > ~/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/tap_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:axchisan/homebrew-tap.git tap
          cd tap
          sed -i "s/^  version \".*\"/  version \"$v\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/lost-and-prompt.rb
          sed -i 's|^  url ".*"|  url "https://github.com/axchisan/lost-and-prompt/releases/download/v#{version}/LostAndPrompt-#{version}-macos-universal.dmg"|' Casks/lost-and-prompt.rb
          grep -q "auto_updates true" Casks/lost-and-prompt.rb || sed -i 's|^  depends_on macos:|  auto_updates true\n  depends_on macos:|' Casks/lost-and-prompt.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "lost-and-prompt $v" && git push
          rm -f ~/tap_key
