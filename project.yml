name: LostAndPrompt
options:
  bundleIdPrefix: com.axchisan
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: es
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  LostAndPrompt:
    type: application
    platform: macOS
    sources:
      - path: LostAndPrompt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.axchisan.LostAndPrompt
        PRODUCT_NAME: LostAndPrompt
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Lost & Prompt"
        INFOPLIST_KEY_CFBundleName: "Lost & Prompt"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 axchisan · MIT"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
